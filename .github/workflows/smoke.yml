# 실서버로만 확인되는 것들을 GitHub 러너에서 한 번 태운다.
#
#   1. strict 커스텀 툴 + web_search 서버 툴을 같은 요청에 넣어도 받아주는가
#   2. Files API로 올린 PDF를 file_id로 첨부하면 읽는가
#
# 실행하려면 저장소 시크릿에 ANTHROPIC_API_KEY가 있어야 한다.
#   Settings → Secrets and variables → Actions → New repository secret
#
# 실행할 때마다 실제 API 요금이 1회분 발생한다.

name: 스모크 (실서버 확인)

on:
  workflow_dispatch:
    inputs:
      web_search:
        description: "웹 검색 켜기 (strict 툴 + web_search 조합 확인)"
        type: boolean
        default: true
      pdf:
        description: "테스트 PDF 첨부 (Files API + file_id 확인)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 시크릿 확인
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::저장소 시크릿 ANTHROPIC_API_KEY가 없습니다. Settings → Secrets and variables → Actions 에서 등록하세요."
            exit 1
          fi
          echo "시크릿 확인됨"

      # 스모크는 lib/db를 쓰지 않는다. better-sqlite3 네이티브 빌드를 건너뛰어
      # 이 잡의 실패 지점을 API 호출 하나로 좁힌다.
      - name: 의존성 설치
        run: npm ci --ignore-scripts

      - name: 테스트 PDF 생성
        if: ${{ inputs.pdf }}
        run: node scripts/make-test-pdf.mjs ./test-fixture.pdf

      - name: 스모크 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEB_SEARCH: ${{ inputs.web_search }}
          USE_PDF: ${{ inputs.pdf }}
        run: |
          set -o pipefail
          args=()
          if [ "$WEB_SEARCH" != "true" ]; then args+=(--no-search); fi
          if [ "$USE_PDF" = "true" ]; then args+=(--pdf ./test-fixture.pdf); fi

          echo "인자: ${args[*]:-(없음)}"
          status=0
          npm run smoke -- "${args[@]}" 2>&1 | tee smoke.log || status=$?

          {
            echo "## 스모크 결과"
            echo ""
            echo '```'
            cat smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status
